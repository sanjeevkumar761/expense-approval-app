<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Approval App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Expense Approval App</h1>
        <p class="muted">Demo: approve / reject / mark as paid</p>
      </header>

      <section class="card">
        <h2>Add Expense</h2>
        <form id="createExpenseForm">
          <div class="row">
            <label>
              Description
              <input name="description" type="text" placeholder="e.g. Client dinner" required />
            </label>
            <label>
              Amount
              <input name="amount" type="number" step="0.01" placeholder="e.g. 42.50" required />
            </label>
          </div>
          <div class="row">
            <label>
              Currency
              <input name="currency" type="text" placeholder="USD" value="USD" />
            </label>
            <label>
              Incurred date
              <input name="incurredDate" type="date" />
            </label>
          </div>
          <button type="submit">Create</button>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>Expenses</h2>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>

        <div id="error" class="error" style="display:none"></div>

        <table class="table" aria-label="Expenses list">
          <thead>
            <tr>
              <th>ID</th>
              <th>Description</th>
              <th>Incurred</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expensesTbody"></tbody>
        </table>
      </section>

      <section class="card chart-card" aria-label="Expenses analytics">
        <div class="chart-header">
          <div>
            <h2 style="margin:0 0 4px">Expenses (last 7 days)</h2>
            <div class="chart-sub">
              Total: <span id="chartTotal" class="chart-total">—</span>
            </div>
          </div>
          <div class="chart-legend" aria-label="Chart legend">
            <span class="legend-dot"></span>
            <span class="legend-label">Daily total</span>
          </div>
        </div>
        <div class="chart-body">
          <canvas id="expensesChart" class="chart-canvas" aria-label="Expenses chart" role="img"></canvas>
        </div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
